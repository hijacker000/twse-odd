<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <title>TWSE 過去 5 個交易日行情查詢 (零股 + 整股)</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #07111f;
      --panel: #101d30;
      --border: #2c4564;
      --text: #e6edf7;
      --muted: #9fb0c4;
      --accent: #4db6ff;
      --up: #f87171;    /* 紅漲 */
      --down: #4ade80;  /* 綠跌 */
      --warn: #fbbf24;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 15% 10%, #123963 0, transparent 35%),
        radial-gradient(circle at 85% 85%, #1a3155 0, transparent 35%),
        var(--bg);
    }

    main {
      width: min(100%, 1500px);
      margin: 0 auto;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.55rem, 4vw, 2.1rem);
    }

    .subtitle {
      margin: 10px 0 24px;
      color: var(--muted);
      line-height: 1.65;
    }

    .panel {
      padding: 22px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: rgb(16 29 48 / 90%);
      box-shadow: 0 16px 42px rgb(0 0 0 / 25%);
    }

    form {
      display: flex;
      flex-wrap: wrap;
      align-items: end;
      gap: 12px;
    }

    label {
      display: grid;
      min-width: 240px;
      gap: 7px;
      color: var(--muted);
      font-size: 0.9rem;
    }

    input, button {
      min-height: 44px;
      border-radius: 10px;
      font: inherit;
    }

    input {
      width: 100%;
      padding: 0 12px;
      color: var(--text);
      background: #091525;
      border: 1px solid var(--border);
      outline: none;
    }

    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgb(77 182 255 / 18%);
    }

    button {
      padding: 0 20px;
      cursor: pointer;
      color: #04111f;
      font-weight: 700;
      background: var(--accent);
      border: 0;
    }

    button:disabled {
      cursor: wait;
      opacity: 0.65;
    }

    #status {
      margin-top: 18px;
    }

    .message {
      padding: 14px;
      border-radius: 10px;
      line-height: 1.6;
    }

    .loading {
      color: #dbeafe;
      background: rgb(59 130 246 / 16%);
      border: 1px solid rgb(96 165 250 / 38%);
    }

    .error {
      color: #ffe4e6;
      background: rgb(244 63 94 / 14%);
      border: 1px solid rgb(251 113 133 / 42%);
    }

    .warning {
      color: #fef3c7;
      background: rgb(245 158 11 / 14%);
      border: 1px solid rgb(251 191 36 / 42%);
    }

    .table-wrap {
      margin-top: 14px;
      overflow: auto;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--panel);
    }

    table {
      width: 100%;
      min-width: 950px;
      border-collapse: collapse;
      font-size: 0.85rem;
      line-height: 1.3;
      font-variant-numeric: tabular-nums;
    }

    thead th {
      position: sticky;
      top: 0;
      z-index: 2;
      color: #eaf5ff;
      background: #173456;
      border: 1px solid var(--border);
      padding: 7px 8px;
      font-weight: 650;
    }

    th.odd-group-header {
      background: #1b3860;
      color: #bae6fd;
      border-bottom: 2px solid var(--accent);
    }

    th.round-group-header {
      background: #23344d;
      color: #fde68a;
      border-bottom: 2px solid var(--warn);
    }

    td {
      padding: 7px 9px;
      text-align: right;
      white-space: nowrap;
      border-bottom: 1px solid var(--border);
      border-right: 1px solid rgb(44 69 100 / 40%);
    }

    th:first-child, td:first-child,
    th:nth-child(2), td:nth-child(2),
    th:nth-child(3), td:nth-child(3) {
      text-align: left;
    }

    tbody tr:hover { background: rgb(77 182 255 / 7%); }

    .date-cell { color: #b9dfff; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .code-cell { color: #dbeafe; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .price-cell { color: #f8fafc; font-weight: 700; }
    .rate-up { color: var(--up); font-weight: 700; }
    .rate-down { color: var(--down); font-weight: 700; }
    .no-trade { color: var(--warn); }
    .note { margin: 14px 2px 0; color: var(--muted); font-size: 0.86rem; line-height: 1.6; }
  </style>
</head>
<body>
  <main>
    <h1>TWSE 過去 5 個交易日行情查詢</h1>
    <p class="subtitle">同步整合「盤後零股」與「當日整股」成交數據。</p>

    <section class="panel">
      <form id="queryForm">
        <label>
          股票代號
          <input
            id="code"
            name="stock_code"
            type="text"
            inputmode="text"
            maxlength="12"
            autocomplete="on"
            placeholder="例如：2330 或 0050"
            required
          >
        </label>

        <label>
          截止日期
          <input id="endDate" type="date" required>
        </label>

        <button id="submitButton" type="submit">查詢過去 5 天</button>
      </form>

      <div id="status" aria-live="polite">
        <div class="message">請輸入資料後按「查詢過去 5 天」。</div>
      </div>

      <div id="tableArea"></div>

      <p class="note">
        資料來源：TWSE 盤後零股交易行情 (TWT53U) & 當日收盤行情 (MI_INDEX)。
      </p>

      <p class="note">
        <a href="https://github.com/hijacker000/twse-odd" target="_blank" rel="noopener noreferrer">
          開啟 GitHub 專案
        </a>
      </p>
    </section>
  </main>

  <script>
    const DATA_SOURCE_URL = "./data/odd_history.json";
    const TARGET_DAYS = 5;

    const form = document.querySelector("#queryForm");
    const codeInput = document.querySelector("#code");
    const endDateInput = document.querySelector("#endDate");
    const submitButton = document.querySelector("#submitButton");
    const status = document.querySelector("#status");
    const tableArea = document.querySelector("#tableArea");

    let cachedHistoryData = null;

    // 預設日期為今天
    const today = new Date();
    const year = today.getFullYear();
    const month = String(today.getMonth() + 1).padStart(2, "0");
    const day = String(today.getDate()).padStart(2, "0");
    endDateInput.value = `${year}-${month}-${day}`;

    // 焦點反白全選
    codeInput.addEventListener("focus", () => {
      codeInput.select();
    });

    // 限制英數字，連打「++」瞬間清空
    codeInput.addEventListener("input", () => {
      if (codeInput.value.includes("++")) {
        codeInput.value = "";
        return;
      }
      codeInput.value = codeInput.value.replace(/[^a-zA-Z0-9+]/g, "").toUpperCase();
    });

    codeInput.addEventListener("blur", () => {
      codeInput.value = codeInput.value.replaceAll("+", "");
    });

    function normalizeCode(value) {
      return String(value || "").trim().toUpperCase().replaceAll(" ", "");
    }

    function formatDisplayDate(dateText) {
      const text = String(dateText || "");
      if (text.length === 8) {
        return text.slice(0, 4) + "-" + text.slice(4, 6) + "-" + text.slice(6, 8);
      }
      return text || "--";
    }

    function setStatus(message, type) {
      status.replaceChildren();
      const box = document.createElement("div");
      box.className = "message" + (type ? " " + type : "");
      box.textContent = message;
      status.append(box);
    }

    function createCell(tagName, text, className) {
      const cell = document.createElement(tagName);
      cell.textContent = text == null || text === "" ? "--" : String(text);
      if (className) cell.className = className;
      return cell;
    }

    function renderTable(records) {
      tableArea.replaceChildren();

      const wrapper = document.createElement("div");
      wrapper.className = "table-wrap";

      const table = document.createElement("table");
      const thead = document.createElement("thead");

      // 第一層 Header
      const headerRow1 = document.createElement("tr");
      
      const thDate = createCell("th", "日期");
      thDate.rowSpan = 2;
      const thCode = createCell("th", "代號");
      thCode.rowSpan = 2;
      const thName = createCell("th", "名稱");
      thName.rowSpan = 2;

      const thOdd = createCell("th", "盤後零股", "odd-group-header");
      thOdd.colSpan = 6;

      const thRound = createCell("th", "當天整股成交資訊", "round-group-header");
      thRound.colSpan = 3;

      headerRow1.append(thDate, thCode, thName, thOdd, thRound);

      // 第二層 Header
      const headerRow2 = document.createElement("tr");
      const subFields = [
        "成交價", "成交股數", "買價", "買量", "賣價", "賣量",
        "收盤價", "漲跌幅", "成交股數"
      ];

      for (const field of subFields) {
        headerRow2.append(createCell("th", field));
      }

      thead.append(headerRow1, headerRow2);

      // 內容 Rows
      const tbody = document.createElement("tbody");
      for (const record of records) {
        const tr = document.createElement("tr");
        const odd = record.item.odd || {};
        const round = record.item.round || {};

        tr.append(createCell("td", formatDisplayDate(record.date), "date-cell"));
        tr.append(createCell("td", record.code, "code-cell"));
        tr.append(createCell("td", record.item.name || "--"));

        // 盤後零股
        tr.append(createCell("td", odd.price, odd.price === "--" ? "no-trade" : "price-cell"));
        tr.append(createCell("td", odd.volume));
        tr.append(createCell("td", odd.bidPrice));
        tr.append(createCell("td", odd.bidVol));
        tr.append(createCell("td", odd.askPrice));
        tr.append(createCell("td", odd.askVol));

        // 整股成交資訊
        tr.append(createCell("td", round.close, "price-cell"));

        let rateClass = "";
        if (round.changeRate && round.changeRate.startsWith("+")) rateClass = "rate-up";
        else if (round.changeRate && round.changeRate.startsWith("-")) rateClass = "rate-down";
        tr.append(createCell("td", round.changeRate, rateClass));

        tr.append(createCell("td", round.volume));

        tbody.append(tr);
      }

      table.append(thead, tbody);
      wrapper.append(table);
      tableArea.append(wrapper);
    }

    async function loadDataset() {
      if (cachedHistoryData) return cachedHistoryData;

      setStatus("正在載入歷史資料庫…", "loading");
      const res = await fetch(DATA_SOURCE_URL, { cache: "no-cache" });
      if (!res.ok) {
        throw new Error(`無法載入歷史資料庫 (${res.status})。請確認 GitHub Actions 是否已執行產生 data/odd_history.json。`);
      }

      cachedHistoryData = await res.json();
      return cachedHistoryData;
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const code = normalizeCode(codeInput.value);
      const endDateValue = endDateInput.value.replaceAll("-", "");

      tableArea.replaceChildren();

      if (!code) {
        setStatus("請輸入股票代號，例如：2330。", "error");
        codeInput.focus();
        return;
      }

      submitButton.disabled = true;
      submitButton.textContent = "檢索中…";

      try {
        const data = await loadDataset();
        const availableDates = Object.keys(data).sort().reverse();

        if (availableDates.length === 0) {
          setStatus("資料庫目前為空，請先透過 GitHub Actions 觸發抓取資料。", "warning");
          return;
        }

        const matchedRecords = [];
        for (const dateStr of availableDates) {
          if (dateStr <= endDateValue) {
            const stockInfo = data[dateStr]?.[code];
            if (stockInfo) {
              matchedRecords.push({
                date: dateStr,
                code: code,
                item: stockInfo
              });
            }
            if (matchedRecords.length >= TARGET_DAYS) break;
          }
        }

        if (matchedRecords.length === 0) {
          setStatus(
            `在截止日 (${formatDisplayDate(endDateValue)}) 前的資料庫中，找不到代號「${code}」的交易紀錄。`,
            "warning"
          );
          return;
        }

        renderTable(matchedRecords);
        setStatus(`已成功載入「${code}」最近 ${matchedRecords.length} 個交易日的行情。`, "loading");
      } catch (error) {
        console.error("Query failed:", error);
        setStatus(error.message || "發生未知錯誤", "error");
      } finally {
        submitButton.disabled = false;
        submitButton.textContent = "查詢過去 5 天";
      }
    });
  </script>
</body>
</html>
