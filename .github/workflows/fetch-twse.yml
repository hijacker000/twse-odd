name: TWSE Odd Lot Fetch

on:
  schedule:
    - cron: '20 7,12 * * 1-5'  # 台北 15:20, 20:20 (週一至五)
    - cron: '50 14 * * 1-5'    # 台北 22:50 (週一至五)
  workflow_dispatch:
    inputs:
      target_date:
        description: '手動重抓日期 (格式: YYYYMMDD，留空代表今天)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch TWSE Data
        env:
          TARGET_DATE: ${{ github.event.inputs.target_date }}
        run: node scripts/fetch-twse.js

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/odd_history.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(data): update TWSE odd lot data" && git push)
